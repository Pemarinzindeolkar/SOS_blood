# Render Blueprint: the web app plus a managed Postgres database.
# In the Render dashboard: New > Blueprint, then pick this repository.
services:
  - type: web
    name: blood-sos
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    # Creating the tables is safe to repeat, so it runs on every start.
    startCommand: npm run db:setup && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: blood-sos-db
          property: connectionString
      # Filled in by you in the dashboard (Render asks for them on the first deploy).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false

databases:
  - name: blood-sos-db
    plan: free
    region: singapore
    databaseName: blood_sos
    user: blood_sos
